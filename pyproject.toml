[project]
name = "duckduckgo-search"
version = "0.1.0"
description = "Web search MCP server backed by DuckDuckGo's no-JS HTML endpoint"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0", "ruff>=0.4.0"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live tests hit the real endpoint and can be blocked by its rate limiter, so
# they are opt-in: run them with `pytest -m integration`.
addopts = "-m 'not integration'"
markers = [
    "integration: hits the live DuckDuckGo endpoint",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"src/ddg_search/__main__.py" = ["T201"]