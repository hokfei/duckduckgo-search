name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check src tests

      - name: Check formatting
        run: python -m ruff format --check src tests

      # Integration tests hit the live DuckDuckGo endpoint, which rate limits
      # aggressively, so CI runs the offline suite only. They are opt-in
      # locally with `pytest -m integration`.
      - name: Tests
        run: python -m pytest tests -q

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build a wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --upgrade pip
          /tmp/smoke/bin/pip install dist/*.whl

      - name: Import and check the CLI
        run: /tmp/smoke/bin/python -m ddg_search --help